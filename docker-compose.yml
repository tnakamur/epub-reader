# ─────────────────────────────────────────────
# epub-reader
# 既存の web-server-net (Caddy) に接続する構成
# ─────────────────────────────────────────────

services:

  # ────────────────────────────
  # PostgreSQL
  # ────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: epub-db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB}
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ:                Asia/Tokyo
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro  # 初回起動時に自動実行
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ────────────────────────────
  # Node.js + Express (API サーバー)
  # ────────────────────────────
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: epub-api
    restart: unless-stopped
    environment:
      NODE_ENV:          production
      PORT:              3000
      DATABASE_URL:      postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET:        ${JWT_SECRET}
      JWT_EXPIRES_IN:    ${JWT_EXPIRES_IN}
      JWT_REFRESH_SECRET:  ${JWT_REFRESH_SECRET}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN}
      UPLOAD_DIR:        /app/uploads
      MAX_FILE_SIZE_MB:  ${MAX_FILE_SIZE_MB}
      TZ:                Asia/Tokyo
    volumes:
      - epub-uploads:/app/uploads   # EPUBファイル永続化
    networks:
      - internal
      - web-server-net              # Caddyからルーティングを受ける
    depends_on:
      db:
        condition: service_healthy

  # ────────────────────────────
  # フロントエンド配信 (静的ファイル)
  # Caddy が直接 client/ を serve する場合は不要だが、
  # コンテナで完結させたい場合用に nginx-alpine を用意
  # ────────────────────────────
  web:
    image: nginx:alpine
    container_name: epub-web
    restart: unless-stopped
    volumes:
      - ./client:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - internal
      - web-server-net              # Caddyからルーティングを受ける
    depends_on:
      - api

# ─────────────────────────────────────────────
# ボリューム
# ─────────────────────────────────────────────
volumes:
  db-data:
    name: epub-db-data
  epub-uploads:
    name: epub-uploads

# ─────────────────────────────────────────────
# ネットワーク
# ─────────────────────────────────────────────
networks:
  internal:
    # DB ↔ API 間の内部通信専用（外部非公開）
    name: epub-internal
    internal: true
  web-server-net:
    # 既存 Caddy と共有する外部ネットワーク
    external: true

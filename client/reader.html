<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>epub reader</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/reader.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2c6fad">
</head>
<body class="reader-page">

  <!-- ヘッダー -->
  <header class="reader-header">
    <button class="header-icon-btn" id="backBtn" title="本棚に戻る">←</button>
    <div class="book-meta">
      <h1 id="bookTitle">読み込み中…</h1>
      <p id="bookAuthor"></p>
    </div>
    <button class="header-icon-btn" id="tocBtn"      title="目次">☰</button>
    <button class="header-icon-btn" id="bmBtn"       title="ブックマーク">🔖</button>
    <button class="header-icon-btn" id="hlBtn"       title="ハイライト">✏️</button>
    <button class="header-icon-btn" id="settingsBtn" title="設定">⚙️</button>
  </header>

  <!-- ビューアー -->
  <div id="readerContainer">
    <!-- ローディングオーバーレイ -->
    <div id="loadingOverlay">
      <div class="spinner"></div>
      <span>EPUBを読み込んでいます…</span>
    </div>

    <!-- EPUB.js レンダリング先 -->
    <div id="viewer"></div>

    <!-- ページ送りボタン -->
    <button class="page-btn" id="prevBtn" aria-label="前のページ">‹</button>
    <button class="page-btn" id="nextBtn" aria-label="次のページ">›</button>
  </div>

  <!-- フッター（進捗バー） -->
  <footer class="reader-footer">
    <div class="progress-bar">
      <div class="progress-fill" id="progressBar" style="width:0%"></div>
    </div>
    <span id="progressLabel">0%</span>
  </footer>

  <!-- パネルオーバーレイ -->
  <div id="panelOverlay" class="panel-overlay"></div>

  <!-- 目次パネル -->
  <aside class="side-panel" id="tocPanel">
    <div class="panel-header">
      <h2>目次</h2>
      <button class="panel-close" onclick="document.getElementById('tocPanel').classList.remove('open')">✕</button>
    </div>
    <div class="panel-body" id="tocList"></div>
  </aside>

  <!-- ブックマークパネル -->
  <aside class="side-panel" id="bookmarkPanel">
    <div class="panel-header">
      <h2>ブックマーク</h2>
      <button class="panel-close" onclick="document.getElementById('bookmarkPanel').classList.remove('open')">✕</button>
    </div>
    <div class="panel-body" id="bookmarkList"></div>
  </aside>

  <!-- ハイライトパネル -->
  <aside class="side-panel" id="highlightPanel">
    <div class="panel-header">
      <h2>ハイライト・メモ</h2>
      <button class="panel-close" onclick="document.getElementById('highlightPanel').classList.remove('open')">✕</button>
    </div>
    <div class="panel-body" id="highlightList"></div>
  </aside>

  <!-- 設定パネル -->
  <aside class="side-panel" id="settingsPanel">
    <div class="panel-header">
      <h2>表示設定</h2>
      <button class="panel-close" onclick="document.getElementById('settingsPanel').classList.remove('open')">✕</button>
    </div>
    <div class="panel-body">
      <div class="settings-section">
        <h3>文字サイズ</h3>
        <div class="font-size-ctrl">
          <span>A</span>
          <input type="range" id="fontSizeRange" min="70" max="180" step="5" value="100">
          <span id="fontSizeLabel">100%</span>
        </div>
      </div>
      <div class="settings-section">
        <h3>テーマ</h3>
        <div class="theme-options">
          <button class="theme-btn active" data-theme="white" title="ホワイト">白</button>
          <button class="theme-btn" data-theme="sepia"  title="セピア">茶</button>
          <button class="theme-btn" data-theme="dark"   title="ダーク">夜</button>
        </div>
      </div>
      <div class="settings-section">
        <h3>フォント</h3>
        <div class="font-options">
          <button class="font-btn active" data-font="serif" title="明朝体">明朝</button>
          <button class="font-btn" data-font="sans" title="ゴシック体">ゴシック</button>
        </div>
      </div>
    </div>
  </aside>

  <!-- トースト -->
  <div id="toastContainer"></div>

  <!-- Import map: resolve bare specifiers for foliate-js CDN modules -->
  <script type="importmap">
  {
    "imports": {
      "construct-style-sheets-polyfill": "https://cdn.jsdelivr.net/npm/construct-style-sheets-polyfill@3.1.0/dist/adoptedStyleSheets.min.js",
      "foliate-js/": "https://cdn.jsdelivr.net/npm/foliate-js@1.0.1/"
    }
  }
  </script>

  <!-- Polyfills for ES2024 (Object.groupBy, Map.groupBy) -->
  <script>
  if (!Object.groupBy) {
    Object.groupBy = function(items, callback) {
      const result = {};
      for (const item of items) {
        const key = callback(item);
        if (!result[key]) result[key] = [];
        result[key].push(item);
      }
      return result;
    };
  }
  if (!Map.groupBy) {
    Map.groupBy = function(items, callback) {
      const result = new Map();
      for (const item of items) {
        const key = callback(item);
        if (!result.has(key)) result.set(key, []);
        result.get(key).push(item);
      }
      return result;
    };
  }
  </script>

  <!-- Core scripts -->
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/db.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/highlights.js"></script>
  <script src="js/bookmarks.js"></script>
  <!-- reader.js (ES module, imports foliate-js from CDN) -->
  <script type="module" src="js/reader.js"></script>
</body>
</html>

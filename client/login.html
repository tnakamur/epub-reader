<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ログイン — epub reader</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/login.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2c6fad">
</head>
<body class="login-page">

  <div class="login-card">
    <div class="login-logo">
      <svg viewBox="0 0 52 52" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="52" height="52" rx="12" fill="#2c6fad"/>
        <path d="M14 12h16a4 4 0 0 1 4 4v24a4 4 0 0 1-4 4H14V12z" fill="#fff" fill-opacity=".25"/>
        <path d="M16 12h16a4 4 0 0 1 4 4v24a4 4 0 0 1-4 4H16a2 2 0 0 1-2-2V14a2 2 0 0 1 2-2z" fill="#fff"/>
        <line x1="20" y1="22" x2="32" y2="22" stroke="#2c6fad" stroke-width="2" stroke-linecap="round"/>
        <line x1="20" y1="27" x2="32" y2="27" stroke="#2c6fad" stroke-width="2" stroke-linecap="round"/>
        <line x1="20" y1="32" x2="28" y2="32" stroke="#2c6fad" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <h1>epub reader</h1>
      <p>あなたのクラウド本棚</p>
    </div>

    <!-- ログインフォームのみ（登録フォームは廃止） -->
    <div class="form-error" id="loginError"></div>
    <div class="form-group">
      <label for="loginEmail">メールアドレス</label>
      <input type="email" id="loginEmail" autocomplete="email" placeholder="you@example.com" required>
    </div>
    <div class="form-group">
      <label for="loginPassword">パスワード</label>
      <input type="password" id="loginPassword" autocomplete="current-password" placeholder="••••••••" required>
    </div>
    <button class="submit-btn" id="loginBtn">ログイン</button>
  </div>

  <div id="toastContainer"></div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    auth.redirectIfLoggedIn();

    async function doLogin() {
      const email    = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;
      const errEl    = document.getElementById('loginError');
      const btn      = document.getElementById('loginBtn');

      errEl.classList.remove('show');
      btn.disabled = true;
      btn.textContent = '確認中…';

      try {
        await auth.login(email, password);
        location.href = '/index.html';
      } catch (e) {
        errEl.textContent = e.message;
        errEl.classList.add('show');
      } finally {
        btn.disabled = false;
        btn.textContent = 'ログイン';
      }
    }

    document.getElementById('loginBtn').addEventListener('click', doLogin);

    ['loginEmail', 'loginPassword'].forEach(id => {
      document.getElementById(id).addEventListener('keydown', (e) => {
        if (e.key === 'Enter') doLogin();
      });
    });
  </script>
</body>
</html>

# ─────────────────────────────────────────────
# nginx/default.conf
# epub-web コンテナ用 (静的ファイル配信)
# ─────────────────────────────────────────────

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── PWA: Service Worker のスコープ設定 ────
    location /sw.js {
        add_header Cache-Control "no-cache";
        add_header Service-Worker-Allowed "/";
        try_files $uri =404;
    }

    # ── manifest.json はキャッシュしない ──────
    location /manifest.json {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # ── 静的アセット (長期キャッシュ) ─────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── SPA フォールバック ──────────────────
    # reader.html / login.html は直接 try_files で返す
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    # ── ヘルスチェック ──────────────────────
    location /healthz {
        return 200 "ok";
        add_header Content-Type text/plain;
    }
}
